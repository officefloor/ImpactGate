[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "impact-gate"
version = "0.1.0"
description = "Measure and gate structural decay from a change (standalone + CI plugin)."
readme = "README.md"
requires-python = ">=3.10"
# Fully standalone: the change-impact measure is vendored in impact_gate/core.
# lizard is the only runtime dependency (multi-language CC + line ranges); PyYAML is
# used only when an .impact-gate.yml config is present.
dependencies = [
    # 1.24.0 is EXCLUDED: its Java state machine loses the second `@` when a bare
    # annotation is followed by a parenthesised one at class level (`@Entity` then
    # `@Table(...)`), so the file parses to ZERO functions and every change to a
    # Spring/JPA entity, repository or controller silently scores impact 0. See
    # tests/test_java_annotations.py, which asserts the behaviour for whatever
    # version resolves here.
    "lizard>=1.17,!=1.24.0",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
impact-gate = "impact_gate.cli:main"

[tool.setuptools]
packages = ["impact_gate", "impact_gate.core", "impact_gate.data"]

[tool.setuptools.package-data]
"impact_gate.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
