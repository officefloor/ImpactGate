name: "impact-gate"
description: "Gate a pull request on three structural measures: change impact, cognitive complexity, and coupling divergence (all on, warn by default)."
branding:
  icon: "activity"
  color: "purple"

inputs:
  mode:
    description: "What to score: staged, worktree, or range (default, for CI)."
    default: "range"
  base:
    description: "Base ref for range mode. Defaults to the PR base (origin/<base_ref>)."
    default: ""
  enforcement:
    description: "Default enforcement for ALL three measures: warn (report only, the default), block (fail the build), or off. Per-measure inputs below override it."
    default: ""
  change-impact:
    description: "Enforcement for the change-impact score: off, warn, or block. Overrides enforcement for this measure."
    default: ""
  cognitive:
    description: "Enforcement for the cognitive-complexity gate: off, warn, or block. Overrides enforcement for this measure."
    default: ""
  coupling:
    description: "Enforcement for the coupling-divergence placement check: off, warn, or block. Overrides enforcement for this measure."
    default: ""
  warn-at:
    description: "Impact above which to warn."
    default: ""
  block-at:
    description: "Impact above which to block."
    default: ""
  tolerance:
    description: "Multiplier applied to both thresholds."
    default: ""
  cognitive-max:
    description: "Cognitive Complexity (Campbell 2018) limit; a method in a changed file over it is flagged. On by default at 20 (SonarSource's line is 15); set 'cognitive: off' to disable the gate."
    default: ""
  config:
    description: "Path to an .impact-gate.yml."
    default: ""
  working-directory:
    description: "Path to the repository to score."
    default: "."
  github-token:
    description: "Token used to post the PR comment. Defaults to the workflow token."
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install impact-gate
      shell: bash
      run: pip install "${{ github.action_path }}"
    - name: Score change impact
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_ENFORCEMENT: ${{ inputs.enforcement }}
        INPUT_CHANGE_IMPACT: ${{ inputs.change-impact }}
        INPUT_COGNITIVE: ${{ inputs.cognitive }}
        INPUT_COUPLING: ${{ inputs.coupling }}
        INPUT_WARN_AT: ${{ inputs.warn-at }}
        INPUT_BLOCK_AT: ${{ inputs.block-at }}
        INPUT_TOLERANCE: ${{ inputs.tolerance }}
        INPUT_COGNITIVE_MAX: ${{ inputs.cognitive-max }}
        INPUT_CONFIG: ${{ inputs.config }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        set +e     # do not abort on a blocking score; capture it and gate at the end
        BASE="$INPUT_BASE"
        if [ -z "$BASE" ]; then
          if [ -n "$GITHUB_BASE_REF" ]; then
            BASE="origin/$GITHUB_BASE_REF"
          else
            BASE="origin/$DEFAULT_BRANCH"
          fi
        fi
        args=(score --repo . --mode "$INPUT_MODE" --base "$BASE")
        if [ -n "$INPUT_ENFORCEMENT" ]; then args+=(--enforcement "$INPUT_ENFORCEMENT"); fi
        if [ -n "$INPUT_CHANGE_IMPACT" ]; then args+=(--change-impact "$INPUT_CHANGE_IMPACT"); fi
        if [ -n "$INPUT_COGNITIVE" ]; then args+=(--cognitive "$INPUT_COGNITIVE"); fi
        if [ -n "$INPUT_COUPLING" ]; then args+=(--coupling "$INPUT_COUPLING"); fi
        if [ -n "$INPUT_WARN_AT" ]; then args+=(--warn-at "$INPUT_WARN_AT"); fi
        if [ -n "$INPUT_BLOCK_AT" ]; then args+=(--block-at "$INPUT_BLOCK_AT"); fi
        if [ -n "$INPUT_TOLERANCE" ]; then args+=(--tolerance "$INPUT_TOLERANCE"); fi
        if [ -n "$INPUT_COGNITIVE_MAX" ]; then args+=(--cognitive-max "$INPUT_COGNITIVE_MAX"); fi
        if [ -n "$INPUT_CONFIG" ]; then args+=(--config "$INPUT_CONFIG"); fi

        report="$RUNNER_TEMP/impact-gate.md"
        impact-gate "${args[@]}" --format markdown | tee "$report"
        code=${PIPESTATUS[0]}
        cat "$report" >> "$GITHUB_STEP_SUMMARY"

        if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$GITHUB_TOKEN" ]; then
          impact-gate comment --body-file "$report" \
            || echo "::warning::impact-gate could not post the PR comment. Grant 'pull-requests: write' to the workflow."
        fi
        exit "$code"
