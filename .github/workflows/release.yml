name: Release

# Cut a release by pushing a version tag, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
# That publishes the pip package to PyPI, pushes a Docker image to GHCR, and
# moves the major-version tag (v0, v1, ...) so the Action can be pinned as
#   officefloor/ImpactGate@v0
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  # Build once; every downstream job consumes the same artifacts.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Guard: the package version (impact_gate.__version__, what PyPI publishes) must
      # match the tag being released. This is skipped for manual workflow_dispatch runs.
      - name: Check tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          pkg="$(python -c 'import impact_gate; print(impact_gate.__version__)')"
          if [ "$GITHUB_REF_NAME" != "v$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match impact_gate.__version__=$pkg (expected v$pkg). Bump impact_gate/__init__.py to match the tag."
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): no API token secret. Configure the publisher once
    # at https://pypi.org/manage/account/publishing/ (project impact-gate, this repo,
    # workflow release.yml, environment pypi).
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run of an already-published version is a no-op, not a failure.
          skip-existing: true

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/officefloor/impact-gate
          # v0.1.0 -> tags 0.1.0, 0.1, 0, latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Move the major-version tag so `@v0` always points at the newest v0.x release.
  major-tag:
    needs: [pypi, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Move major tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"          # e.g. v0.1.0
          major="${ref%%.*}"                # e.g. v0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"

  # Create the GitHub Release for the tag, with generated notes and the built
  # artifacts attached. The Release is where the Marketplace listing lives: the first
  # listing is a one-time manual step (edit the Release, tick "Publish this Action to
  # the GitHub Marketplace"); after that, each release created here updates the listing.
  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent, like the skip-existing PyPI publish: create the release if it
          # does not exist yet, otherwise just refresh the attached artifacts.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
